# Lint configuration for the inference pipeline.
#
#   ruff check src scripts app.py tests
#   ruff format --check src scripts app.py tests
#
# Targets Python 3.9 so the `typing.Dict` / `typing.Optional` spellings used
# throughout (together with `from __future__ import annotations`) are correct
# rather than flagged as outdated.

target-version = "py39"
line-length = 100

[lint]
select = [
    "F",   # pyflakes: undefined names, unused imports
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "C4",  # comprehension clarity
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B905",  # zip(strict=) is not available on Python 3.9
]

[lint.per-file-ignores]
# The Streamlit demo must extend sys.path before importing project modules.
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]

[lint.isort]
known-first-party = ["src", "tests"]
