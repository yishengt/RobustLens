# Lint configuration for the inference pipeline.
#
#   ruff check .
#   ruff format --check .
#
# `.` rather than an explicit file list: an explicit list silently stops
# covering any file added later, and left the vendored model.py unchecked.
#
# Targets Python 3.9 so the `typing.Dict` / `typing.Optional` spellings used
# throughout (together with `from __future__ import annotations`) are correct
# rather than flagged as outdated.

target-version = "py39"
line-length = 100

[lint]
select = [
    "F",   # pyflakes: undefined names, unused imports
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "C4",  # comprehension clarity
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B905",  # zip(strict=) is not available on Python 3.9
]

# model.py is vendored verbatim from the Bombek1 detector so the checkpoint
# deserialises against the exact classes that produced it. It is kept
# byte-faithful to upstream and deliberately not reformatted, so that a diff
# against the source repository stays meaningful.
exclude = ["model.py"]

[lint.per-file-ignores]
# The Streamlit demo must extend sys.path before importing project modules.
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]

[lint.isort]
known-first-party = ["src", "tests"]
